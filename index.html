<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salta Hub · Mis Proyectos</title>
<style>
  :root{
    --bg:#0f0e0c;
    --card:#1c1a17;
    --card-hover:#26231e;
    --border:#2e2a24;
    --accent:#e8a33d;
    --accent-2:#c65d3b;
    --text:#f2ede4;
    --muted:#9a9186;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(circle at 20% 0%, rgba(232,163,61,.08), transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(198,93,59,.08), transparent 40%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:32px 20px 60px;
  }
  header{
    max-width:1000px;
    margin:0 auto 36px;
    text-align:center;
  }
  header h1{
    font-size:clamp(1.8rem,4vw,2.6rem);
    font-weight:800;
    letter-spacing:-.5px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:8px;
  }
  header p{
    color:var(--muted);
    font-size:.95rem;
  }
  .grid{
    max-width:1000px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:18px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:inherit;
    transition:transform .18s ease, background .18s ease, border-color .18s ease;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    opacity:0;
    transition:opacity .18s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    background:var(--card-hover);
    border-color:var(--accent);
  }
  .card:hover::before{opacity:1}
  .card .icon{
    font-size:2rem;
    margin-bottom:14px;
    line-height:1;
  }
  .card h2{
    font-size:1.15rem;
    font-weight:700;
    margin-bottom:8px;
    color:var(--text);
  }
  .card p{
    color:var(--muted);
    font-size:.88rem;
    line-height:1.5;
    flex-grow:1;
  }
  .card .arrow{
    margin-top:16px;
    color:var(--accent);
    font-size:.85rem;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
  }
  footer{
    max-width:1000px;
    margin:50px auto 0;
    text-align:center;
    color:var(--muted);
    font-size:.8rem;
  }
</style>
</head>
<body>

<header>
  <h1>Salta Hub</h1>
  <p>Mis proyectos en un solo lugar</p>
</header>

<main class="grid" id="grid"></main>

<footer>
  <p>Hecho con 🧉 en Salta, Argentina</p>
</footer>

<script>
/* ============================================================
   ⬇️  EDITÁ ACÁ: agregá, quitá o modificá proyectos
   ============================================================ */
const proyectos = [
  {
    emoji: "🗺️",
    titulo: "Mapa Salta Offline",
    descripcion: "Mapa con ubicación, velocímetro y puntos de interés: transporte, salud, comida, seguridad y más.",
    url: "https://jr8969662-beep.github.io/mapa-salta-offline/"
  },
  {
    emoji: "🗣️",
    titulo: "Hablá Salta",
    descripcion: "Dictá lo que necesitás y escuchá la traducción al español. Pensado para comunicarte con visitantes.",
    url: "https://jr8969662-beep.github.io/habla-salta-/"
  },
  {
    emoji: "📜",
    titulo: "Código Contravencional Salta",
    descripcion: "Normativa contravencional de la provincia de Salta, consultable de forma rápida.",
    url: "https://jr8969662-beep.github.io/codigo-contravnecional-salta/"
  },
  {
    emoji: "📷",
    titulo: "Escanear DNI",
    descripcion: "Sacá capturas del sistema, generá un formulario con los datos del turno y enviá todo por WhatsApp.",
    url: "https://jr8969662-beep.github.io/scaenar-dni/"
  }
];
/* ============================================================
   ⬆️  No toques nada debajo de esta línea
   ============================================================ */

const grid = document.getElementById('grid');

proyectos.forEach(p => {
  const card = document.createElement('a');
  card.className = 'card';
  card.href = p.url;
  card.target = '_blank';
  card.rel = 'noopener noreferrer';
  card.innerHTML = `
    <div class="icon">${p.emoji}</div>
    <h2>${p.titulo}</h2>
    <p>${p.descripcion}</p>
    <div class="arrow">Abrir proyecto →</div>
  `;
  grid.appendChild(card);
});
</script>

</body>
</html>
